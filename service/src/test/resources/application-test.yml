# Configuracion de pruebas.
#
# PROVISIONAL: emplea H2 en memoria para que la construccion se mantenga en
# verde sin exigir un motor real ni Docker. VER-07 exige pruebas de integracion
# contra PostgreSQL en contenedor efimero; se incorporan en el incremento
# siguiente con Testcontainers, y entonces esta configuracion desaparece.
#
# Flyway queda desactivado aqui porque las migraciones son SQL de PostgreSQL.
# El esquema de prueba lo deriva JPA del modelo de entidades.

spring:
  datasource:
    url: jdbc:h2:mem:slcp;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

# Configuracion de sesion para pruebas. La clave es de usar y tirar.
slcp:
  session:
    secret: clave-de-prueba-de-al-menos-32-caracteres-largo
    access-ttl: PT15M
    refresh-ttl: P7D
    cookie-secure: false
    access-cookie-name: slcp_access
    refresh-cookie-name: slcp_refresh

  # Sin remitente, el envio queda desactivado en las pruebas: no deben depender
  # de un servidor de correo ni enviar nada de verdad.
  mail:
    from: ""
    from-name: SLCP
    base-url: http://localhost:4200
