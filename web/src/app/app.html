<a class="saltar" href="#contenido">Ir al contenido</a>

<header class="barra">
  <div class="contenedor barra__interior">
    <a class="marca" routerLink="/">
      <span class="marca__sigla">SLCP</span>
      <span class="marca__nota">Universidad Técnica Estatal de Quevedo</span>
    </a>

    <nav class="nav" aria-label="Principal">
      <a routerLink="/" routerLinkActive="nav__enlace--activo" [routerLinkActiveOptions]="{ exact: true }" class="nav__enlace">
        Qué hace
      </a>

      @if (sesion() && !esAdministrador()) {
        <a routerLink="/trabajo" routerLinkActive="nav__enlace--activo" class="nav__enlace">
          Mi trabajo
        </a>
      }

      @if (esAdministrador()) {
        <a routerLink="/administracion" routerLinkActive="nav__enlace--activo" class="nav__enlace">
          Administración
        </a>
      }

      @if (sesion(); as u) {
        <span class="nav__quien">{{ u.username }}</span>
      } @else {
        <a routerLink="/solicitar-registro" routerLinkActive="nav__enlace--activo" class="nav__enlace">
          Solicitar registro
        </a>
        <a routerLink="/entrar" routerLinkActive="nav__enlace--activo" class="nav__sesion">
          Iniciar sesión
        </a>
      }
    </nav>
  </div>
</header>

<div id="contenido">
  <router-outlet />
</div>
